[build]
  functions = "netlify/functions"
  publish = "build/client"
  node_version = "20.x"
  

[dev]
  functions = "netlify/functions"
  publish = "build/client"
  port = 3000
  framework = "vite"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true


[[headers]]
  for = "/build/*"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, s-maxage=31536000"