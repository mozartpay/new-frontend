[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "build/client"

[dev]
  command = "npm run dev"
  functions = "netlify/functions"
  publish = "build/client"
  port = 3000

[[redirects]]
  from = "/*"
  to = "netlify/functions/server"
  status = 200
  force = true


[[headers]]
  for = "/build/*"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, s-maxage=31536000"